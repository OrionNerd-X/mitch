{% extends 'tracker/base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2>Task List</h2>
<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Assigned To</th>
            <th>Phase</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for task in tasks %}
            <tr>
                <td>{{ task.title }}</td>
                <td>{{ task.assigned_to.user.username }}</td>
                <td>{{ task.get_phase_display }}</td>
                <td>
                    <a href="{% url 'update_task' task.id %}">Edit</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
